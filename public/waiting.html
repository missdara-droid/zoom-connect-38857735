<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Please wait...</title>
<style>
  /* Kept intentionally plain so it matches a typical existing app's
     base styling. Replace this <style> block with your app's own
     waiting/loading styles if you have them. */
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 100px auto; text-align: center; }
  .spinner {
    width: 40px; height: 40px; margin: 24px auto;
    border: 4px solid #ddd; border-top-color: #333; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .session-id { color: #999; font-size: 12px; margin-top: 30px; }
  .error { color: #c0392b; }
</style>
</head>
<body>
  <h2>Processing your request...</h2>
  <div class="spinner"></div>
  <p>Please wait while this is reviewed.</p>
  <p class="session-id" id="sessionLabel"></p>
  <p class="error" id="errorLabel"></p>

<script>
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get("session");
  const POLL_INTERVAL_MS = 1500;

  if (!sessionId) {
    document.getElementById("errorLabel").textContent =
      "Missing session. Please go back and try again.";
  } else {
    document.getElementById("sessionLabel").textContent = "Session: " + sessionId;
    pollSession();
  }

  async function pollSession() {
    try {
      const res = await fetch("/api/sessions/" + encodeURIComponent(sessionId));

      if (!res.ok) {
        document.getElementById("errorLabel").textContent =
          "Session not found. It may have expired.";
        return; // stop polling
      }

      const session = await res.json();

      if (session.status === "WAITING") {
        setTimeout(pollSession, POLL_INTERVAL_MS);
        return;
      }

      if (session.status === "READY") {
        if (session.action === "WITH_NUMBER") {
          // Hand off to page 2; page 2 looks up the number itself
          // from the backend using this session id.
          window.location.href = "/page2.html?session=" + encodeURIComponent(sessionId);
        } else if (session.action === "WITHOUT_NUMBER") {
          window.location.href = "/dummy.html?session=" + encodeURIComponent(sessionId);
        }
        return;
      }

      // Unknown status - keep polling defensively
      setTimeout(pollSession, POLL_INTERVAL_MS);
    } catch (err) {
      // Network hiccup - just retry
      setTimeout(pollSession, POLL_INTERVAL_MS);
    }
  }
</script>
</body>
</html>
