<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zoom Workplace</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">
        <!-- To use a logo later, replace the text with:
             <img src="assets/images/logo.png" alt="Product Logo"> -->
        <div class="product-name">
            <img
                src="https://commons.wikimedia.org/wiki/Special:FilePath/Zoom_Logo_2022.svg"
                alt="Zoom"
                style="width: 110px; height: auto;"
            >
        </div>

        <nav class="site-nav" aria-label="Main">
            <a href="#">Request a Demo</a>
            <a href="#">Join</a>
            <a href="#">Host</a>
            <a href="#">Sign In</a>
        </nav>
    </header>

    <main class="main-content">

        <section class="participant-panel" aria-label="Participants">
            <div class="online-counter">
                <span id="onlineCountText">0 user(s) online</span>
                <span class="online-dot" aria-hidden="true"></span>
            </div>

            <div class="participants" id="participants"></div>
        </section>

        <aside class="meeting-panel">
            <div class="meeting-prompt">
                <h2>Please click the button below to join the meeting</h2>

                <div class="communication-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.3 9.2 9.2 0 0 1-3.6-.7L3 21l1.8-4.9A8 8 0 0 1 3 11.5C3 7 7 3.2 12 3.2s9 3.8 9 8.3z"/>
                        <circle cx="8.5" cy="11.5" r=".6" fill="#fff"/>
                        <circle cx="12" cy="11.5" r=".6" fill="#fff"/>
                        <circle cx="15.5" cy="11.5" r=".6" fill="#fff"/>
                    </svg>
                </div>
            </div>

            <button type="button" id="joinMeetingButton" class="join-button">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="6" width="13" height="12" rx="2.5"/>
                    <path d="M15 10.5l6-3.5v10l-6-3.5z"/>
                </svg>
                <span id="joinMeetingText">Join Meeting</span>
            </button>
        </aside>

    </main>

    <script src="script.js"></script>
</body>
</html>
