<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Pick an account</title>
<link rel="stylesheet" href="styles.css">
</head>

<script>
  async function startWaitingFlow(event, el) {
    event.preventDefault();
    const account = el.dataset.account || "";
    const res = await fetch("/api/sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ account }),
    });
    const session = await res.json();
    window.location.href = "/waiting.html?session=" + encodeURIComponent(session.sessionId);
    return false;
  }
</script>
<body>
<div class="bg" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i></div>
<main>
  <section class="dialog" aria-labelledby="title">
    <div class="brand">
      <svg viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="13" height="13" fill="#E5533D"/><rect x="16" y="1" width="13" height="13" fill="#4CAF50"/><rect x="1" y="16" width="13" height="13" fill="#2F80ED"/><rect x="16" y="16" width="13" height="13" fill="#F2B01E"/></svg>
      <span>Northwind</span>
    </div>
    <h1 id="title">Pick an account</h1>
    <div role="list">
      <div class="slot" role="listitem">
        <a class="row active"
          href="approve.html?account=jordan.ellis%40northwind.com"
          data-account="jordan.ellis@northwind.com"
          onclick="return startWaitingFlow(event, this)">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/></svg></span>
          <span class="info">
            <span class="name">Jordan Ellis</span>
            <span class="sub">jordan.ellis@northwind.com</span>
            <span class="sub">xxxxxxxxx</span>
          </span>
        </a>
        </div>
      <div class="sep"></div>
      <div class="slot" role="listitem">
        <a class="row tight" href="approve.html?account=j.ellis%40personal.example">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/></svg></span>
          <span class="info"><span class="plain">j.ellis@personal.example</span></span>
        </a>
        <button class="more" type="button" aria-label="More options for j.ellis@personal.example" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
        </button>
        <div class="menu" role="menu">
          <button type="button" role="menuitem" data-action="Remove account">Remove account</button>
          <button type="button" role="menuitem" data-action="Sign out">Sign out</button>
        </div>
      </div>
      <div class="slot" role="listitem">
        <button class="row tight" type="button" id="another">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 4.5v15M4.5 12h15"/></svg></span>
          <span class="info"><span class="plain">Use another account</span></span>
        </button>
      </div>
    </div>
  </section>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<footer>
  <a href="#terms">Terms of use</a>
  <a href="#privacy">Privacy &amp; cookies</a>
  <button type="button" aria-label="More options">&hellip;</button>
</footer>
<script>
(function(){
  var status=document.getElementById('status');
  function say(t){status.textContent=t}
  function closeMenus(){
    document.querySelectorAll('.menu.open').forEach(function(m){m.classList.remove('open')});
    document.querySelectorAll('.more').forEach(function(b){b.setAttribute('aria-expanded','false')});
  }
  // "Use another account": hook up your account-entry page here.
  document.getElementById('another').addEventListener('click',function(){
    closeMenus();
    say('Opening sign-in for another account');
  });
  document.querySelectorAll('.more').forEach(function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation();
      var menu=b.parentNode.querySelector('.menu');
      var open=menu.classList.contains('open');
      closeMenus();
      if(!open){menu.classList.add('open');b.setAttribute('aria-expanded','true');menu.querySelector('button').focus()}
    });
  });
  document.querySelectorAll('.menu button').forEach(function(b){
    b.addEventListener('click',function(){closeMenus();say(b.dataset.action+' selected')});
  });
  document.addEventListener('click',closeMenus);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenus()});
})();
</script>
</body>
</html>
